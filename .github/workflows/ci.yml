name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  python-tests:
    name: Python tests (pytest + coverage)
    runs-on: ubuntu-latest
    env:
      # analysis.py creates $RESULTS_DIR/.cache at import time; /app/results is
      # not writable on the runner, so point it at the workspace.
      RESULTS_DIR: ${{ github.workspace }}/.ci-results
      HELIXIGHT_WORK_DIR: ${{ github.workspace }}/.ci-results/.work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bcftools and tabix (tests parse the sample VCF with bcftools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bcftools tabix
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt -r frontend/requirements.txt
      - name: Run pytest with coverage
        # frontend/ is put on sys.path by tests/conftest.py, so the modules are
        # measured by name. app.py (the Streamlit UI) is never imported by the
        # tests and is deliberately not included in the gate.
        run: |
          python -m pytest -q \
            --cov=analysis --cov=pdf_report \
            --cov-report=term-missing --cov-fail-under=40

  shell-lint:
    name: Shell lint (shellcheck + bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: shellcheck (error level)
        run: |
          shellcheck --version
          shellcheck -S error scripts/*.sh scripts/lib/*.sh helixight.sh install.sh tests/shell/*.sh
      - name: bash -n
        run: |
          status=0
          for f in scripts/*.sh scripts/lib/*.sh helixight.sh install.sh tests/shell/*.sh; do
            bash -n "$f" || { echo "syntax error: $f"; status=1; }
          done
          exit "$status"

  script-smoke:
    name: Script smoke run on the sample VCF
    runs-on: ubuntu-latest
    env:
      # The `runner` context is not available at job level (only in steps), so
      # the smoke tree lives under the workspace like the python-tests job's.
      SMOKE: ${{ github.workspace }}/.ci-smoke
      HELIXIGHT_WORK_DIR: ${{ github.workspace }}/.ci-smoke/work
      HELIXIGHT_REFERENCE_DIR: ${{ github.workspace }}/.ci-smoke/reference
    steps:
      - uses: actions/checkout@v4
      - name: Install bcftools, tabix (bgzip) and bc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bcftools tabix bc
          bcftools --version | head -1
      - name: Sample VCF sanity (bgzip + tabix index, region queries work)
        run: |
          n=$(bcftools view -H data/sample_genome.vcf.gz | wc -l)
          echo "records: $n"
          test "$n" -gt 0
          test -s data/sample_genome.vcf.gz.tbi
          bcftools query -r 9:133257520-133257521 -f '%CHROM\t%POS\t%REF\t%ALT\t[%GT]\n' data/sample_genome.vcf.gz
      - name: Shared library tests (tests/shell/test_vcf_common.sh)
        run: bash tests/shell/test_vcf_common.sh
      - name: Script regression tests (tests/shell/test_scripts.sh)
        run: bash tests/shell/test_scripts.sh
      - name: Seed a fake ClinVar cache (no download in CI)
        # clinvar_scan.sh reuses $HELIXIGHT_REFERENCE_DIR/clinvar_GRCh38.vcf.gz when it
        # is present and younger than HELIXIGHT_CLINVAR_MAX_AGE_DAYS; it filters it on
        # INFO/CLNSIG, so the fake carries CLNSIG/CLNDN/CLNREVSTAT and a ##fileDate.
        run: |
          mkdir -p "$HELIXIGHT_REFERENCE_DIR" "$HELIXIGHT_WORK_DIR"
          # Columns are written with '|' and turned into tabs (YAML/editors mangle literal tabs).
          cat <<'VCF' | tr '|' '\t' > "$SMOKE/clinvar.vcf"
          ##fileformat=VCFv4.2
          ##fileDate=2026-09-01
          ##source=Helixight-CI-fake-ClinVar
          ##INFO=<ID=CLNSIG,Number=.,Type=String,Description="Clinical significance">
          ##INFO=<ID=CLNDN,Number=.,Type=String,Description="Disease name">
          ##INFO=<ID=CLNREVSTAT,Number=.,Type=String,Description="Review status">
          ##contig=<ID=1>
          ##contig=<ID=7>
          ##contig=<ID=11>
          #CHROM|POS|ID|REF|ALT|QUAL|FILTER|INFO
          1|11796321|rs1801133|G|A|.|.|CLNSIG=Benign;CLNDN=not_provided;CLNREVSTAT=criteria_provided
          7|117559590|rs113993960|ATCT|A|.|.|CLNSIG=Pathogenic;CLNDN=Cystic_fibrosis;CLNREVSTAT=practice_guideline
          11|5227002|rs334|T|A|.|.|CLNSIG=Pathogenic;CLNDN=Sickle_cell_anemia;CLNREVSTAT=practice_guideline
          VCF
          bcftools view -Oz -o "$HELIXIGHT_REFERENCE_DIR/clinvar_GRCh38.vcf.gz" "$SMOKE/clinvar.vcf"
          bcftools index -t "$HELIXIGHT_REFERENCE_DIR/clinvar_GRCh38.vcf.gz"
      - name: Build a chr-prefixed copy of the sample
        run: |
          mkdir -p "$SMOKE/chr"
          for c in $(seq 1 22) X Y MT; do echo "$c chr$c"; done > "$SMOKE/to_chr.txt"
          bcftools annotate --rename-chrs "$SMOKE/to_chr.txt" -Oz -o "$SMOKE/chr/sample_chr.vcf.gz" data/sample_genome.vcf.gz
          bcftools index -t "$SMOKE/chr/sample_chr.vcf.gz"
          bcftools view -h "$SMOKE/chr/sample_chr.vcf.gz" | grep -c '^##contig=<ID=chr'
      - name: Run every analysis registered in frontend/analysis.py (bare and chr-prefixed input)
        run: |
          REPO=$PWD
          SCRIPTS=$(python3 -c '
          import re, pathlib
          src = pathlib.Path("frontend/analysis.py").read_text()
          print("\n".join(sorted(set(re.findall(r"\"script\":\s*\"([^\"]+\.sh)\"", src)))))
          ')
          test -n "$SCRIPTS" || { echo "no scripts found in frontend/analysis.py ANALYSES"; exit 1; }
          echo "Scripts under test:"; echo "$SCRIPTS" | sed 's/^/  /'
          failed=0
          normalise() { # drop the echoed input path, timestamps and ClinVar cache-state lines
            sed -e "s#$2##g" -e 's/[0-9]\{8\}_[0-9]\{6\}/TIMESTAMP/g' "$1" \
              | grep -v -e 'ClinVar contains' -e 'Using existing pathogenic' || true
          }
          for s in $SCRIPTS; do
            for variant in bare chr; do
              if [[ $variant == bare ]]; then vcf="$REPO/data/sample_genome.vcf.gz"; else vcf="$SMOKE/chr/sample_chr.vcf.gz"; fi
              d="$SMOKE/$variant/$s"; mkdir -p "$d"
              if ( cd "$d" && bash "$REPO/scripts/$s" "$vcf" > "$d/stdout.txt" 2> "$d/stderr.txt" ); then rc=0; else rc=$?; fi
              # `|| true`: under the step's `bash -eo pipefail`, grep's exit 1 on a
              # missing line would otherwise abort the step before the diagnostics.
              cov=$(grep -o 'HX_DATA_COVERAGE: [0-9]*/[0-9]* markers' "$d/stdout.txt" | tail -1 || true)
              printf '%-32s %-5s rc=%-3s %s\n' "$s" "$variant" "$rc" "${cov:-<no HX_DATA_COVERAGE line>}"
              if [[ $rc -ne 0 ]]; then
                failed=1
                echo "::error::$s exited $rc on $variant input"
                echo "--- stdout (tail):"; tail -20 "$d/stdout.txt"
                echo "--- stderr (tail):"; tail -20 "$d/stderr.txt"
              fi
              if [[ -z $cov ]]; then
                failed=1
                echo "::error::$s printed no HX_DATA_COVERAGE line on $variant input"
              fi
              normalise "$d/stdout.txt" "$vcf" > "$d/stdout.norm.txt"
            done
            if ! diff -u "$SMOKE/bare/$s/stdout.norm.txt" "$SMOKE/chr/$s/stdout.norm.txt"; then
              failed=1
              echo "::error::$s output differs between bare and chr-prefixed input"
            fi
          done
          exit "$failed"

  docker:
    name: Docker build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build image
        run: docker build -t helixight:ci .
      - name: Python dependencies importable
        run: docker run --rm --entrypoint python helixight:ci -c 'import fpdf, streamlit, plotly; print(fpdf.__version__, streamlit.__version__, plotly.__version__)'
      - name: Runs as the unprivileged user
        run: test "$(docker run --rm --entrypoint id helixight:ci -u)" = 10001
      - name: Tools and bundled sample present, a script runs inside the image
        run: |
          docker run --rm --entrypoint bash helixight:ci -c '
            set -euo pipefail
            bcftools --version | head -1
            test -s /data/sample_genome.vcf.gz && test -s /data/sample_genome.vcf.gz.tbi
            cd "$RESULTS_DIR"
            HELIXIGHT_WORK_DIR="$RESULTS_DIR/.work" bash /app/scripts/blood_type.sh /data/sample_genome.vcf.gz | tail -5
          '
